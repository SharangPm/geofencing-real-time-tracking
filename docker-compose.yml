services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      ADDR: :8080
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://fleet:${POSTGRES_PASSWORD:-fleet-local-password}@db:5432/fleet?sslmode=disable
      DB_MIN_CONNS: 2
      DB_MAX_CONNS: 20
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/vehicles"]
      interval: 20s
      timeout: 4s
      retries: 3
  web:
    build: ./web
    ports: ["5173:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
